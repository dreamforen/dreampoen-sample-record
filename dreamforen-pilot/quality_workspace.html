<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>품질문서</title><link rel="stylesheet" href="quality_workspace.css?v=411">
<link rel="stylesheet" href="file_drop.css?v=beta33">
</head>
<body class="qw-book">
<header class="appbar">
 <button type="button" id="back">← 품질문서</button>
 <strong id="bookTitle">품질문서</strong>
 <span id="saveState" role="status" aria-live="polite">불러오는 중…</span>
 <button type="button" id="retry" hidden>저장 재시도</button>
</header>
<div class="layout">
<aside class="sidebar">
 <div class="toc-head"><strong>목차</strong><button type="button" id="toggleToc" aria-expanded="true" aria-controls="tocBody">접기</button></div>
 <div id="tocBody">
  <label class="sr-only" for="search">목차 검색</label>
  <input id="search" type="search" placeholder="번호·제목 검색">
  <nav id="toc" aria-label="품질문서 목차"></nav>
 </div>
</aside>
<main>
<div id="message" role="alert" hidden></div>
<button type="button" id="retryLoad" hidden>다시 불러오기</button>
<div id="documentPanel">
<section class="docbar">
 <div class="doc-identity"><span id="code"></span><h1 id="title">문서 불러오는 중…</h1><small id="meta"></small></div>
 <div class="actions">
  <button type="button" id="currentDocument" hidden>현재 문서</button>
  <button type="button" id="newDraft" disabled>수정</button>
  <button type="button" id="save" disabled hidden>저장</button>
  <button type="button" id="approve" disabled hidden>결재상신</button>
  <button type="button" id="viewDraft" hidden>개정안 보기</button>
  <button type="button" id="approvalList" hidden>연결된 결재</button>
  <button type="button" id="previewMode" aria-pressed="false" hidden>미리보기</button>
  <button type="button" id="editMode" aria-pressed="false" hidden>편집 계속</button>
  <button type="button" id="print" disabled>인쇄 / PDF</button>
  <details id="moreMenu">
   <summary>더보기</summary>
   <div class="more-menu">
    <button type="button" id="filesMenu">원본·첨부</button>
    <button type="button" id="historyMenu">개정이력</button>
    <button type="button" id="printBook">전체 인쇄 / PDF</button>
    <button type="button" id="matchingTab">문서 매칭</button>
    <button type="button" id="correct" hidden>번호 유지 정정</button>
    <button type="button" id="finishCorrection" hidden>정정 마치기</button>
    <button type="button" id="cancelRevision" hidden>개정 취소</button>
    <button type="button" id="refreshStatus">최신 상태 확인</button>
    <button type="button" id="backup" disabled>현재 문서 백업</button>
    <button type="button" id="reloadDocument" hidden>서버본 다시 열기</button>
    <button type="button" id="importButton" hidden>기준문서 가져오기</button>
    <input type="file" id="importFile" accept=".json" data-df-drop="off" hidden>
   </div>
  </details>
 </div>
</section>
<section class="toolbar" aria-label="문서 도구">
 <div class="toolbar-row"><label>배율 <select id="zoom"><option value="fit">화면 맞춤</option><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option></select></label><span id="pageCount"></span></div>
<fieldset id="formatTools" disabled><legend class="sr-only">글자 및 문단 서식</legend><label>글꼴<select id="font"><option>맑은 고딕</option><option>굴림</option><option>바탕</option><option>한양신명조</option><option>한양중고딕</option><option>휴먼명조</option></select></label><label>크기(pt)<input id="size" type="number" min="6" max="72" step="0.5" value="11"></label><button data-command="bold" title="굵게 (Ctrl+B)"><b>가</b></button><button data-command="italic" title="기울임"><i>가</i></button><button data-command="underline" title="밑줄"><u>가</u></button><label>글자색<input id="color" type="color" value="#000000"></label><button data-align="left">왼쪽</button><button data-align="center">가운데</button><button data-align="right">오른쪽</button><button data-align="justify">양쪽</button><button id="undo">실행취소</button><button id="redo">다시실행</button></fieldset>
<fieldset id="paragraphTools" disabled><legend class="sr-only">문단 및 용지 설정</legend><label>왼쪽(mm)<input id="indentLeft" type="number" min="0" max="80" step="0.5" value="0"></label><label>첫 줄(mm)<input id="indentFirst" type="number" min="-80" max="80" step="0.5" value="0" title="양수: 들여쓰기, 음수: 내어쓰기"></label><label>줄간격(%)<input id="line" type="number" min="80" max="300" step="10" value="160"></label><button id="applyPara">문단 적용</button><button id="table">표 삽입</button><button id="tableWidth">표·열 너비</button><button id="pageBreak">쪽 나누기</button><button id="margins">용지 여백</button></fieldset>
</section>
<section class="details">
 <details id="filesPanel" hidden><summary>원본·첨부파일</summary>
  <div class="archive-actions">
   <a id="manualOriginalPdf" href="assets/quality_manual_rev02.pdf" target="_blank" rel="noopener" hidden>원본 PDF</a>
   <a id="manualOriginalHwp" href="assets/quality_manual_rev02.hwp" download hidden>원본 HWP</a>
   <button type="button" id="legacyFiles" hidden>기존 업로드 자료</button>
   <input aria-label="원본·첨부파일 업로드" id="upload" type="file" accept=".hwp,.hwpx,.pdf,.docx,.xlsx,.png,.jpg,.jpeg">
  </div>
  <div id="files"></div>
 </details>
 <details id="historyPanel" hidden><summary>개정이력</summary><button type="button" id="refreshHistory">이력 새로고침</button><div id="history"></div><div id="snapshots"></div></details>
</section>
<div id="canvas" class="canvas"><div id="empty" hidden>등록된 문서가 없습니다.</div><div id="editorPages" hidden></div><div id="printPages" hidden></div></div>
</div>
<section id="matchingPanel" class="matching-panel" hidden>
<div class="matching-heading"><div><h1>문서 매칭</h1></div><div><button type="button" id="documentTab">← 문서</button> <button type="button" id="matchRefresh">새로고침</button></div></div>
<p id="matchSummary" role="status"></p><p id="matchBookHistory" class="matching-note" hidden></p>
<section id="matchDetail" class="match-detail" hidden>
 <h2><span id="matchKey"></span></h2><p id="matchLock"></p><p id="matchEvidence" class="matching-note"></p>
 <fieldset id="matchFields"><legend class="sr-only">매칭 정보</legend><div class="match-form">
  <label>문서 제목<input id="matchTitle" maxlength="160"></label>
  <label>개정번호<input id="matchRevision" type="number" min="0" max="9999" step="1"></label>
  <label class="wide">본문 연결<select id="matchBody"></select><small id="matchBodyFrom"></small></label>
  <label class="wide">정정 사유<input id="matchReason" maxlength="2000"></label>
 </div></fieldset>
 <div class="matching-actions"><button id="matchEdit">본문 정정</button><button id="matchReset">되돌리기</button><button id="matchSave">매칭 저장</button></div>
 <p id="matchPreviewLabel"></p><div id="matchPreview"></div>
</section>
<div class="matching-table-wrap"><table class="matching-table"><thead><tr><th>문서번호 · 현재 제목</th><th>본문 적용번호</th><th>현재 목차 연결</th><th>대조 결과</th><th>수정</th></tr></thead><tbody id="matchRows"></tbody></table></div></section>

</main></div>
<dialog id="reviewDialog" aria-labelledby="reviewTitle">
 <form method="dialog">
  <h2 id="reviewTitle">결재상신</h2>
  <label>개정 사유<textarea id="reason" maxlength="2000" rows="3"></textarea></label>
  <label class="checkbox"><input type="checkbox" id="reviewed">본문과 인쇄 결과를 확인했습니다.</label>
  <details id="reviewPanel" hidden><summary>원본 확인사항 <span id="issueCount"></span></summary><div id="issues"></div></details>
  <p id="reviewError" role="alert" hidden></p>
  <div class="dialog-actions"><button id="reviewClose" value="cancel">닫기</button><button type="button" id="reviewSubmit">결재선 지정</button></div>
 </form>
</dialog>
<dialog id="marginDialog"><form method="dialog"><h2>용지 여백</h2><div class="margin-grid"><label>왼쪽(mm)<input name="left" type="number" min="5" max="60" step=".5"></label><label>오른쪽(mm)<input name="right" type="number" min="5" max="60" step=".5"></label><label>위(mm)<input name="top" type="number" min="5" max="60" step=".5"></label><label>아래(mm)<input name="bottom" type="number" min="5" max="60" step=".5"></label><label>머리말 영역(mm)<input name="header" type="number" min="10" max="60" step=".5"></label><label>꼬리말 영역(mm)<input name="footer" type="number" min="5" max="30" step=".5"></label></div><button value="cancel">취소</button><button id="applyMargins" value="apply">적용</button></form></dialog>
<dialog id="tableWidthDialog"><form method="dialog"><h2>표·열 너비</h2><p id="tableWidthLimit"></p><label>표 전체 (mm) <input id="tableTotal" type="number" min="3" step=".1" required></label><button id="tableEqual" type="button">열 너비 균등하게</button><div id="tableColumns" class="margin-grid"></div><p id="tableWidthError" role="alert"></p><button value="cancel">취소</button><button id="tableWidthApply" value="apply">적용</button></form></dialog>
<script src="quality_workspace_core.js?v=beta36"></script><script src="quality_workspace_format.js?v=6"></script><script src="quality_workspace_tables.js?v=6"></script><script src="quality_workspace_print.js?v=6"></script><script src="quality_workspace.js?v=411"></script>
<script src="file_drop.js?v=beta33"></script>
</body></html>
